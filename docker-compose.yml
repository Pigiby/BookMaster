name: bookmaster

# Shared settings for the services that read the project's .env file.
x-env: &env
  env_file: .env
  restart: unless-stopped

services:
  nginx:
    build: ./containers/nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs   # a self-signed cert is generated here on first start
    depends_on:
      web:
        condition: service_healthy

  web:
    <<: *env
    build: ./containers/node
    deploy:
      replicas: ${WEB_REPLICAS:-3}
    depends_on:
      couchdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  couchdb:
    image: couchdb:3.5
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?set COUCHDB_USER in .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?set COUCHDB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5984:5984"   # Fauxton admin UI: http://localhost:5984/_utils
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"   # AMQP, for running the web app outside Docker
      - "127.0.0.1:15672:15672" # management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailer:
    <<: *env
    build: ./containers/mailer
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  couchdb-data:
  rabbitmq-data:
