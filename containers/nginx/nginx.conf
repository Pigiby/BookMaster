events {}

http {
    # Docker's DNS returns one address per "web" replica; nginx round-robins
    # across them and re-resolves, so scaling or recreating replicas just works.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream web {
        zone web 64k;
        server web:3000 resolve;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server-cert.crt;
        ssl_certificate_key /etc/nginx/certs/server-cert.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
