name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: containers/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: containers/node/package-lock.json
      - run: npm ci
      - run: npm test

  stack:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Check the app through nginx
        run: |
          curl -fsk https://localhost/status
          curl -fsk -o /dev/null https://localhost/
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/getreview/byid)" = 400
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
